name: Build Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all python3-setuptools python3-build dpkg-dev apt-utils

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi

          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" \
            --title "WiFi-Nightmare ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            ../wifi-nightmare_*.deb

      - name: Update APT repository on gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DEB_FILE=$(realpath ../wifi-nightmare_*.deb)
          cp install.sh /tmp/wifi-nightmare-install.sh

          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true

          mkdir -p pool/main/w/wifi-nightmare/
          mkdir -p dists/stable/main/binary-amd64/

          cp "$DEB_FILE" pool/main/w/wifi-nightmare/
          cp /tmp/wifi-nightmare-install.sh install.sh

          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file without apt-ftparchive
          cd dists/stable
          PKGS=main/binary-amd64/Packages
          PKGS_GZ=main/binary-amd64/Packages.gz
          MD5=$(md5sum $PKGS | awk '{print $1}')
          SHA1=$(sha1sum $PKGS | awk '{print $1}')
          SHA256=$(sha256sum $PKGS | awk '{print $1}')
          SIZE=$(stat -c%s $PKGS)
          MD5_GZ=$(md5sum $PKGS_GZ | awk '{print $1}')
          SHA1_GZ=$(sha1sum $PKGS_GZ | awk '{print $1}')
          SHA256_GZ=$(sha256sum $PKGS_GZ | awk '{print $1}')
          SIZE_GZ=$(stat -c%s $PKGS_GZ)
          DATE=$(date -Ru)
          cat > Release <<RELEASE_EOF
Origin: WiFi-Nightmare
Label: WiFi-Nightmare
Suite: stable
Codename: stable
Architectures: amd64
Components: main
Description: WiFi-Nightmare APT repository
Date: $DATE
MD5Sum:
 $MD5 $SIZE $PKGS
 $MD5_GZ $SIZE_GZ $PKGS_GZ
SHA1:
 $SHA1 $SIZE $PKGS
 $SHA1_GZ $SIZE_GZ $PKGS_GZ
SHA256:
 $SHA256 $SIZE $PKGS
 $SHA256_GZ $SIZE_GZ $PKGS_GZ
RELEASE_EOF
          cd ../..

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update APT repo: ${GITHUB_REF_NAME}"
          git push origin gh-pages --force
