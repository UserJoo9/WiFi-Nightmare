name: Build Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all python3-setuptools python3-build dpkg-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "WiFi-Nightmare $GITHUB_REF_NAME" \
            --notes "Automated build of WiFi-Nightmare $GITHUB_REF_NAME" \
            ../wifi-nightmare_*.deb

      - name: Update APT repository on gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Save absolute paths before switching branches
          DEB_FILE=$(realpath ../wifi-nightmare_*.deb)
          cp install.sh /tmp/wifi-nightmare-install.sh

          # Switch to gh-pages branch (create orphan if missing)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true

          # Create APT repo structure
          mkdir -p pool/main/w/wifi-nightmare/
          mkdir -p dists/stable/main/binary-amd64/

          # Copy .deb and install script
          cp "$DEB_FILE" pool/main/w/wifi-nightmare/
          cp /tmp/wifi-nightmare-install.sh install.sh

          # Generate Packages metadata
          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file
          echo "Origin: WiFi-Nightmare APT Repository" > dists/stable/Release
          echo "Label: WiFi-Nightmare" >> dists/stable/Release
          echo "Suite: stable" >> dists/stable/Release
          echo "Codename: stable" >> dists/stable/Release
          echo "Architectures: amd64" >> dists/stable/Release
          echo "Components: main" >> dists/stable/Release
          echo "Description: WiFi-Nightmare APT repository" >> dists/stable/Release

          # Commit and push
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update APT repo: ${GITHUB_REF_NAME}"
          git push origin gh-pages --force
