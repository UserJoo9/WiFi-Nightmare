name: Build Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all python3-setuptools python3-build dpkg-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the matching section from CHANGELOG.md
          # Tag is "v2.1.2", section header is "## [2.1.2]"
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi

          # Delete any existing release from a previous run to avoid conflicts
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" \
            --title "WiFi-Nightmare ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            ../wifi-nightmare_*.deb

      - name: Update APT repository on gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Save absolute paths before switching branches
          DEB_FILE=$(realpath ../wifi-nightmare_*.deb)
          cp install.sh /tmp/wifi-nightmare-install.sh

          # Switch to gh-pages branch (create orphan if missing)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true

          # Create APT repo structure
          mkdir -p pool/main/w/wifi-nightmare/
          mkdir -p dists/stable/main/binary-amd64/

          # Copy .deb and install script
          cp "$DEB_FILE" pool/main/w/wifi-nightmare/
          cp /tmp/wifi-nightmare-install.sh install.sh

          # Generate Packages metadata
          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file with proper hashes and date
          apt-ftparchive release dists/stable > dists/stable/Release 2>/dev/null

          # Commit and push
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update APT repo: ${GITHUB_REF_NAME}"
          git push origin gh-pages --force
