name: Build Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all python3-setuptools python3-build dpkg-dev apt-utils

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi

          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" \
            --title "WiFi-Nightmare ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            ../wifi-nightmare_*.deb

      - name: Update APT repository on gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          DEB_FILE=$(realpath ../wifi-nightmare_*.deb)
          cp install.sh /tmp/wifi-nightmare-install.sh

          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true

          mkdir -p pool/main/w/wifi-nightmare/
          mkdir -p dists/stable/main/binary-amd64/
          mkdir -p dists/stable/main/binary-arm64/
          mkdir -p dists/stable/main/binary-all/

          cp "$DEB_FILE" pool/main/w/wifi-nightmare/
          cp /tmp/wifi-nightmare-install.sh install.sh

          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          cp -f dists/stable/main/binary-amd64/Packages* dists/stable/main/binary-arm64/
          cp -f dists/stable/main/binary-amd64/Packages* dists/stable/main/binary-all/

          if command -v apt-ftparchive >/dev/null 2>&1; then
            apt-ftparchive release dists/stable > dists/stable/Release
          else
            cd dists/stable
            DATE=$(date -Ru)
            {
              echo "Origin: WiFi-Nightmare"
              echo "Label: WiFi-Nightmare"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Architectures: amd64 arm64 all"
              echo "Components: main"
              echo "Description: WiFi-Nightmare APT repository"
              echo "Date: $DATE"
              echo "MD5Sum:"
              find main -type f | while read -r f; do
                echo " $(md5sum "$f" | awk '{print $1}') $(stat -c%s "$f") $f"
              done
              echo "SHA1:"
              find main -type f | while read -r f; do
                echo " $(sha1sum "$f" | awk '{print $1}') $(stat -c%s "$f") $f"
              done
              echo "SHA256:"
              find main -type f | while read -r f; do
                echo " $(sha256sum "$f" | awk '{print $1}') $(stat -c%s "$f") $f"
              done
            } > Release
            cd ../..
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update APT repo: ${GITHUB_REF_NAME}"
          git push origin gh-pages --force
